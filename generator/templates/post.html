<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <meta name="description" content="{{ title }}">
    <link rel="canonical" href="https://www.tomhoule.com/{{ slug }}/">
    {% include "favicon.html" %}
    <link rel="alternate" type="application/rss+xml" title="Tom Houlé's homepage" href="/index.xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include "background.html" %}
    <div class="content-column">
    {% include "header.html" %}
    <article class="blog-post" id="main" role="main">
        <header class="post-header">
            <p class="post-meta"><time datetime="{{ date }}">{{ date }}</time></p>
            <h1>{{ title }}</h1>
        </header>
        {{ content | safe }}
    </article>
    {% include "footer.html" %}
    </div>
</body>
</html>
