{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block description %}{{ title }}{% endblock %}
{% block canonical %}{{ crate::SITE_URL }}/{{ slug }}/{% endblock %}
{% block content %}
    <article class="blog-post" id="main" role="main">
        <header class="post-header">
            <p class="post-meta"><time datetime="{{ date }}">{{ date }}</time></p>
            <h1>{{ title }}</h1>
        </header>
        {{ content | safe }}
    </article>
{% endblock %}
