{% extends "base.html" %}
{% block content %}
            <main class="post-index" id="main">
                <h1 class="visually-hidden">Blog posts</h1>
                <section class="introduction" aria-label="About Tom Houlé">
                    <p>
                        I'm Tom Houlé, currently an engineer at
                        <a href="https://zed.dev/">Zed Industries</a>.
                    </p>
                    <p>
                        Elsewhere:
                        <a href="https://github.com/tomhoule">GitHub</a>,
                        <a href="https://bsky.app/profile/tomhoule.com">Bluesky</a>.
                        <a href="https://github.com/tomhoule/cv/blob/main/cv_tom_houle.pdf">CV</a>.
                    </p>
                </section>
                <ol class="post-list">
                    {% for post in posts %}
                    <li>
                        <time datetime="{{ post.date }}">{{ post.date }}</time>
                        <a href="/{{ post.slug }}/">{{ post.title }}</a>
                    </li>
                    {% endfor %}
                </ol>
            </main>
{% endblock %}
