<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog posts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    {% include "background.html" %}
    <div class="content-column">
    {% include "header.html" %}
    <main class="post-index">
        <ol class="post-list">
        {% for post in posts %}
            <li>
                <time datetime="{{ post.date }}">{{ post.date }}</time>
                <a href="/{{ post.slug }}.html">{{ post.title }}</a>
            </li>
        {% endfor %}
        </ol>
    </main>
    </div>
</body>
</html>
