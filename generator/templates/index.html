<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Blog posts</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main>
        <h1>Blog posts</h1>
        <ul>
        {% for post in posts %}
            <li>
                <a href="/{{ post.slug }}.html">{{ post.title }}</a>
                <time datetime="{{ post.date }}">{{ post.date }}</time>
            </li>
        {% endfor %}
        </ul>
    </main>
</body>
</html>
