<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Blog posts{% endblock %}</title>
    <meta name="description" content="{% block description %}Tom Houlé's homepage and blog posts{% endblock %}">
    <link rel="canonical" href="{% block canonical %}{{ crate::SITE_URL }}/{% endblock %}">
    {% include "favicon.html" %}
    <link rel="alternate" type="application/rss+xml" title="Tom Houlé's homepage" href="/index.xml">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include "background.html" %}
    <div class="content-column">
        {% include "header.html" %}
        {% block content %}{% endblock %}
        {% include "footer.html" %}
    </div>
</body>
</html>
